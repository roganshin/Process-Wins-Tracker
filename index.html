<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>오늘의 점수판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet"></noscript>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1b1e2b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="점수판">
<style>
  :root{
    --bg:#1b1e2b;--bg2:#161824;--card:#252a3b;--card-hi:#2e3650;--line:#343b52;
    --ink:#eef1f8;--mut:#8a91a8;--mut2:#666d85;
    --gold:#e8b257;--gold-dim:#5a4a2a;--teal:#67a6ab;--teal-dim:#2c4448;
    --bggrad:radial-gradient(120% 60% at 50% -10%, #232842 0%, var(--bg) 55%, var(--bg2) 100%);
    --cardgrad:linear-gradient(180deg,var(--card),#222739);
    --numgrad:linear-gradient(180deg,#fff,#cdd3e6);
  }
  /* 시스템이 라이트 모드일 때: 흰 배경 + 어두운 글씨 */
  @media (prefers-color-scheme: light){
    :root{
      --bg:#ffffff;--bg2:#f3f4f8;--card:#f6f7fb;--card-hi:#ebedf4;--line:#e3e5ee;
      --ink:#1b1e2b;--mut:#5f6678;--mut2:#9298ab;
      --gold:#b07d24;--gold-dim:#ead9b3;--teal:#2f7d83;--teal-dim:#d3e7e8;
      --bggrad:radial-gradient(120% 60% at 50% -10%, #f4f1ea 0%, var(--bg) 55%, var(--bg2) 100%);
      --cardgrad:linear-gradient(180deg,var(--card),#eef0f6);
      --numgrad:linear-gradient(180deg,#3a3f52,#1b1e2b);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif}
  body{max-width:480px;margin:0 auto;padding:26px 20px 64px;min-height:100vh;overflow-x:hidden;
    background:var(--bggrad)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

  .topbar{display:flex;justify-content:space-between;align-items:baseline}
  .eyebrow{font-size:13px;letter-spacing:.12em;color:var(--mut);font-weight:500}
  .clock{font-family:'Fraunces',serif;font-size:14px;color:var(--gold);font-weight:500;font-variant-numeric:tabular-nums}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:30px;line-height:1.1;margin:6px 0 2px}
  .sub{color:var(--mut);font-size:13.5px;line-height:1.5;margin-top:8px}

  .carry{margin-top:18px;background:var(--cardgrad);
    border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:14px;padding:14px 16px}
  .carry .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .carry .val{margin-top:5px;font-size:15.5px;font-weight:500;line-height:1.4}
  .carry.empty{display:none}

  .score{margin:24px 0 6px;text-align:center}
  .score .num{font-family:'Fraunces',serif;font-weight:600;font-size:84px;line-height:.9;
    background:var(--numgrad);-webkit-background-clip:text;background-clip:text;color:transparent;
    transition:transform .25s cubic-bezier(.2,1.4,.4,1)}
  .score .num.win{background:linear-gradient(180deg,#ffe3a0,var(--gold));-webkit-background-clip:text;background-clip:text}
  .score .num.pop{transform:scale(1.12)}
  .score .denom{font-size:34px;color:var(--mut2);font-weight:400;font-family:'Fraunces',serif}
  .score .cap{margin-top:4px;color:var(--mut);font-size:13px}
  .score .cap b{color:var(--gold);font-weight:700}
  .stats{display:flex;justify-content:center;gap:18px;margin-top:12px}
  .stat{text-align:center}
  .stat .v{font-family:'Fraunces',serif;font-size:22px;color:var(--ink);line-height:1}
  .stat .v b{color:var(--gold)}
  .stat .k{font-size:11px;color:var(--mut2);margin-top:4px;letter-spacing:.04em}

  .sectlbl{display:flex;align-items:center;gap:10px;margin:30px 4px 12px;color:var(--mut);
    font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
  .sectlbl::after{content:"";flex:1;height:1px;background:var(--line)}
  /* + 항목추가 동그라미 버튼 (과정 승리 헤더 우측) */
  .sectlbl-add::after{display:none}
  .sectlbl-add .ln{flex:1;height:1px;background:var(--line)}
  .addchip{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--gold);
    background:transparent;color:var(--gold);font-size:19px;line-height:0;font-weight:400;
    display:grid;place-items:center;cursor:pointer;font-family:inherit;padding:0;
    transition:background .15s,transform .12s}
  .addchip:active{transform:scale(.9)}
  .addchip:hover{background:var(--gold-dim)}

  /* 스와이프 삭제용 래퍼 + 뒤에 깔린 빨간 삭제 버튼 */
  .winwrap{position:relative;margin-bottom:10px;border-radius:14px;overflow:hidden;transition:transform .2s cubic-bezier(.2,.8,.3,1)}
  /* 순서 이동(드래그) 중: 들어올림 + 그림자 (아이폰식) */
  .winwrap.dragging{overflow:visible;z-index:6}
  .winwrap.dragging .win{box-shadow:0 10px 26px rgba(0,0,0,.32);border-color:var(--gold-dim);background:var(--card-hi)}
  @media (prefers-color-scheme: light){.winwrap.dragging .win{box-shadow:0 10px 26px rgba(0,0,0,.14)}}
  /* 빨간 삭제 영역: 평소엔 숨김(opacity 0) → 탭 시 카드 축소돼도 노출 안 됨.
     스와이프가 실제로 시작될 때(.swiping)나 열렸을 때(.open)만 보임 */
  .swipe-del{position:absolute;top:0;right:0;bottom:0;left:0;border:none;
    background:#e0524e;color:#fff;font-size:30px;font-weight:300;
    display:flex;align-items:center;justify-content:flex-end;padding-right:27px;
    cursor:pointer;font-family:inherit;opacity:0;transition:opacity .15s}
  .winwrap.swiping .swipe-del,.winwrap.open .swipe-del{opacity:1}

  .win{position:relative;z-index:1;display:flex;align-items:center;gap:13px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:14px 15px;cursor:pointer;
    transition:transform .25s cubic-bezier(.2,.8,.3,1),background .15s,border-color .15s;
    will-change:transform;touch-action:pan-y}
  .win.done{background:linear-gradient(90deg,#2c2a22,#262a3b);border-color:var(--gold-dim)}
  @media (prefers-color-scheme: light){.win.done{background:linear-gradient(90deg,#faf3e2,#eef0f6)}}
  .box{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--mut2);
    display:grid;place-items:center;transition:all .18s}
  .win.done .box{background:var(--gold);border-color:var(--gold)}
  .box svg{width:15px;height:15px;opacity:0;transform:scale(.4);transition:all .2s cubic-bezier(.2,1.5,.4,1)}
  .win.done .box svg{opacity:1;transform:scale(1)}
  .win .mid{flex:1;min-width:0}
  .win .txt{font-size:15.5px;font-weight:500;transition:color .15s;outline:none;border-radius:6px}
  .win.done .txt{color:var(--mut)}
  .win .ts{font-size:11.5px;color:var(--gold);margin-top:3px;display:none;font-variant-numeric:tabular-nums}
  .win.done .ts{display:block}
  /* 순서 이동 손잡이(세 줄) — 탭/체크 영역과 간섭 안 되게 우측 분리 */
  .grip{flex:none;width:34px;height:34px;margin:-6px -8px -6px 0;display:grid;place-items:center;
    color:var(--mut2);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
  .grip:active{cursor:grabbing;color:var(--gold)}
  .grip svg{width:19px;height:19px;display:block;pointer-events:none}
  /* 꾹 눌러 편집 중인 텍스트 */
  .win.row-editing{cursor:text}
  .win.row-editing .box{opacity:.35}
  .txt.editing-txt{background:var(--bg2);box-shadow:0 0 0 2px var(--gold) inset;padding:2px 7px;margin:-2px -7px}
  .txt.editing-txt:empty:before{content:'항목 입력…';color:var(--mut2)}
  .winwrap.removing{transition:height .28s ease,margin .28s ease,opacity .28s ease;overflow:hidden}
  .hint{text-align:center;color:var(--mut2);font-size:11px;margin:2px 0 4px}

  .ghost{flex:1;background:transparent;border:1px dashed var(--line);color:var(--mut);
    border-radius:12px;padding:12px;font-size:13.5px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .15s}
  .ghost:active{background:var(--card)}

  .rest{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;text-align:center}
  .rest p{color:var(--mut);font-size:13px;line-height:1.55;margin-bottom:14px}
  .rest p b{color:var(--ink)}
  .restbtn{width:100%;background:transparent;border:1.5px solid var(--teal);color:var(--teal);
    border-radius:13px;padding:14px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .12s}
  .restbtn:active{background:var(--teal-dim);transform:scale(.98)}
  .restmsg{overflow:hidden;max-height:0;opacity:0;transition:max-height .35s ease,opacity .35s,margin .35s}
  .restmsg.show{max-height:140px;opacity:1;margin-top:14px}
  .restmsg .m{color:var(--teal);font-size:14px;font-weight:500;line-height:1.5}
  .restmsg .c{color:var(--mut2);font-size:12px;margin-top:6px;font-variant-numeric:tabular-nums}

  .strip{display:flex;justify-content:space-between;gap:6px;padding:4px 2px}
  .day{flex:1;text-align:center}
  .dot{width:34px;height:34px;margin:0 auto 6px;border-radius:50%;border:2px solid var(--line);
    display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--mut2);position:relative;overflow:hidden}
  .dot .fill{position:absolute;left:0;bottom:0;width:100%;background:var(--gold);opacity:.85;transition:height .4s}
  .dot.full{border-color:var(--gold)}
  .dot.full .n{color:#1b1e2b}
  .dot .n{position:relative;z-index:1}
  .day .wd{font-size:11px;color:var(--mut2)}
  .day.today .wd{color:var(--gold);font-weight:700}
  .day.today .dot{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--gold)}
  /* 테두리 색 = 그날 '멈추고 싶다' 횟수 (채움색=과정승리와 별개) */
  .restcap{text-align:center;color:var(--mut2);font-size:11px;margin-top:12px}
  .restlegend{display:flex;justify-content:center;flex-wrap:wrap;gap:9px 12px;margin-top:8px;color:var(--mut2);font-size:11px}
  .restlegend span{display:inline-flex;align-items:center;gap:5px}
  .restlegend i{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;box-sizing:border-box}

  .tmr{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .tmr label{display:block;color:var(--mut);font-size:13px;line-height:1.5;margin-bottom:10px}
  .tmr .inrow{display:flex;gap:8px;align-items:stretch}
  .tmr input{flex:1 1 auto;min-width:0;width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);
    border-radius:11px;padding:13px;font-size:15px;font-family:inherit;outline:none;transition:border-color .15s}
  .tmr input:focus{border-color:var(--gold)}
  .tmr input::placeholder{color:var(--mut2)}
  .save{flex:none;background:var(--gold);color:#241c08;border:none;border-radius:11px;
    padding:0 18px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:opacity .15s}
  .save:active{opacity:.8}
  .saved{color:var(--teal);font-size:12.5px;margin-top:9px;opacity:0;transition:opacity .3s}
  .saved.show{opacity:1}

  .foot{text-align:center;color:var(--mut2);font-size:11.5px;line-height:1.6;margin-top:34px}
  .foot .badge{display:inline-block;margin-top:8px;padding:3px 10px;border:1px solid var(--line);
    border-radius:20px;font-size:10.5px;letter-spacing:.05em}
  .loading{text-align:center;color:var(--mut);padding:60px 0;font-size:14px}
  .adder{display:none;gap:8px;margin-bottom:10px}
  .adder.show{display:flex}
  .adder input{flex:1;background:var(--bg2);border:1px solid var(--gold-dim);color:var(--ink);
    border-radius:12px;padding:14px;font-size:15px;font-family:inherit;outline:none}
  .backup-msg{color:var(--teal);font-size:12.5px;margin-top:9px;opacity:0;transition:opacity .3s}
  .backup-msg.show{opacity:1}

  /* ---------- 랜딩 화면 ---------- */
  .landing{min-height:calc(100vh - 90px);display:flex;flex-direction:column;justify-content:center;
    text-align:center;animation:fadein .5s ease both}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .land-eyebrow{font-size:13px;letter-spacing:.12em;color:var(--mut);font-weight:500}
  .land-h1{font-family:'Fraunces',serif;font-weight:600;font-size:40px;line-height:1.1;margin:10px 0 0}
  .land-sub{color:var(--mut);font-size:15px;line-height:1.6;margin-top:14px}
  .land-note{margin:32px 0 8px;background:var(--cardgrad);border:1px solid var(--line);
    border-left:3px solid var(--gold);border-radius:16px;padding:20px 18px;text-align:left}
  .land-note .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .land-note .val{margin-top:8px;font-size:18px;font-weight:600;line-height:1.45}
  .land-note.empty{border-left-color:var(--line);background:var(--card)}
  .land-note.empty .val{font-size:14.5px;font-weight:400;color:var(--mut);line-height:1.6}
  .land-btn{margin-top:30px;width:100%;background:var(--gold);color:#241c08;border:none;border-radius:14px;
    padding:16px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:opacity .15s,transform .08s}
  .land-btn:active{opacity:.85;transform:scale(.985)}
  .land-skip{margin-top:14px;background:none;border:none;color:var(--mut2);font-size:13px;
    font-family:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .landing.swipe-in{animation:slideInLeft .34s cubic-bezier(.2,.8,.3,1) both}
  @keyframes slideInLeft{from{opacity:0;transform:translateX(-44px)}to{opacity:1;transform:none}}
  /* 랜딩 → 본화면 고급 전환: 랜딩은 왼쪽으로 빠지고, 본화면은 오른쪽에서 들어옴 */
  .landing.leaving{animation:landLeave .36s cubic-bezier(.45,0,.2,1) forwards;pointer-events:none}
  @keyframes landLeave{to{opacity:0;transform:translateX(-34px) scale(.985);filter:blur(2px)}}
  .page-in{animation:pageIn .42s cubic-bezier(.2,.8,.25,1) both}
  @keyframes pageIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

  /* ---------- 탭 모션: 눌림 효과 + 리플 ---------- */
  button{position:relative;overflow:hidden;touch-action:manipulation}
  button:active{transform:scale(.97)}
  button{transition:transform .08s ease,opacity .15s}
  /* 항목 탭 피드백: 카드 전체가 아니라 체크박스만 살짝 눌림 → 뒤 빨강 노출 없음 */
  .win:active .box{transform:scale(.88)}
  .ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.22;
    transform:scale(0);pointer-events:none;animation:rip .55s ease-out forwards}
  @keyframes rip{to{transform:scale(2.4);opacity:0}}
  /* 동작 줄이기 설정 시 모든 모션 비활성화(기존 정책 유지) */
</style>
</head>
<body>
  <div id="app"><div class="loading">불러오는 중…</div></div>

<script>
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

/* ---------- storage: window.storage(클라우드) 우선, 없으면 localStorage ---------- */
const CLOUD = (typeof window!=='undefined' && window.storage && typeof window.storage.get==='function');
const STORE_LABEL = CLOUD ? '클라우드 저장' : '이 기기에 저장';
async function sget(k){
  if(CLOUD){ try{const r=await window.storage.get(k); return r?JSON.parse(r.value):null;}catch(e){return null;} }
  try{const v=localStorage.getItem(k); return v?JSON.parse(v):null;}catch(e){return null;}
}
async function sset(k,v){
  if(CLOUD){ try{await window.storage.set(k,JSON.stringify(v)); return;}catch(e){} }
  try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}
}

/* ---------- helpers ---------- */
const SVG_CHECK='<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#241c08" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SVG_GRIP='<svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const WD=['일','월','화','수','목','금','토'];
const DEFAULT_WINS=[
  {id:'w1',label:'지원·실행 1건'},
  {id:'w2',label:'폰 없는 집중 1블록 (25분)'},
  {id:'w3',label:'스피킹 모의 1세트'},
];
const REST_LINES=[
  ['알아챘으면 된 거야.','이름 붙이는 순간 루프가 한 칸 약해져.'],
  ['이건 회복이 아니라 반응성 휴식.','5분만 쉬고 25분 타이머 하나만 더.'],
  ['집중에서 도망치고 싶은 거지, 못 하는 게 아니야.','한 줄짜리 가장 작은 행동부터.'],
  ['괜찮아. 알아챈 것만으로 절반은 이긴 거.','폰은 다른 방에. 의지 말고 마찰력으로.'],
];
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function fmtTime(d){let h=d.getHours();const m=pad(d.getMinutes());const ap=h<12?'오전':'오후';h=h%12||12;return `${ap} ${h}:${m}`;}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
/* '지금 멈추고 싶다' 횟수별 테두리 색 (과정승리 채움색=gold 와 무관) */
const REST_BANDS=[
  {max:5,  color:'#43b06f', label:'0–5'},
  {max:10, color:'#4b8fda', label:'6–10'},
  {max:15, color:'#8a6fd4', label:'11–15'},
  {max:19, color:'#cf69a4', label:'16–19'},
  {max:Infinity, color:'#e05a5a', label:'20+'},
];
function restColor(n){ n=n||0; for(const b of REST_BANDS){ if(n<=b.max) return b.color; } return '#e05a5a'; }

/* ---------- state ---------- */
let TODAY, today;
let config={wins:DEFAULT_WINS.slice()};
let day={checks:{},times:{},rest:0,note:''};
let index=[];

function setToday(){ today=new Date(); today.setHours(0,0,0,0); TODAY=keyOf(today); }

async function loadDay(){
  const d=await sget('day:'+TODAY);
  day = d ? {checks:d.checks||{},times:d.times||{},rest:d.rest||0,note:d.note||''} : {checks:{},times:{},rest:0,note:''};
}
async function load(){
  setToday();
  const c=await sget('config'); if(c&&c.wins) config=c;
  const idx=await sget('index'); if(Array.isArray(idx)) index=idx;
  await loadDay();
}
function doneCount(){return config.wins.filter(w=>day.checks[w.id]).length;}

async function saveDay(){
  await sset('day:'+TODAY,day);
  const has=doneCount()>=1;
  const inIdx=index.includes(TODAY);
  if(has&&!inIdx){index.push(TODAY); index.sort(); await sset('index',index);}
  else if(!has&&inIdx){index=index.filter(x=>x!==TODAY); await sset('index',index);}
}
async function saveConfig(){ await sset('config',config); }

function streak(){
  const set=new Set(index);
  let d=new Date(today), n=0;
  if(!set.has(keyOf(d))) d.setDate(d.getDate()-1);
  while(set.has(keyOf(d))){n++; d.setDate(d.getDate()-1);}
  return n;
}

/* ---------- backup: export / import ---------- */
async function exportData(){
  const data={};
  data['config']=await sget('config');
  data['index']=await sget('index');
  const idx=await sget('index');
  const dayKeys=CLOUD ? [] : Object.keys(localStorage).filter(k=>k.startsWith('day:'));
  if(!CLOUD){
    for(const k of dayKeys) data[k]=await sget(k);
  } else if(Array.isArray(idx)){
    for(const date of idx) data['day:'+date]=await sget('day:'+date);
    const todayKey='day:'+TODAY;
    if(!data[todayKey]) data[todayKey]=await sget(todayKey);
  }
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`jumsupan-backup-${TODAY}.json`; a.click();
  URL.revokeObjectURL(url);
}

async function importData(file){
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    for(const [k,v] of Object.entries(data)){
      if(v!==null) await sset(k,v);
    }
    await load(); await render();
    const msg=document.getElementById('backupMsg');
    if(msg){msg.textContent='복원 완료!';msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),3000);}
  }catch(e){alert('파일을 읽을 수 없어. JSON 형식이 맞는지 확인해.');}
}

/* ---------- 랜딩 화면: 앱 열면 먼저 보이는 인사 + 오늘의 첫 행동 ---------- */
function renderLanding(swipe){
  const dateStr=`${today.getMonth()+1}월 ${today.getDate()}일 ${WD[today.getDay()]}요일`;
  const h=new Date().getHours();
  const greet = h<5?'아직 밤이야' : h<12?'좋은 아침이야' : h<18?'좋은 오후야' : '좋은 저녁이야';
  const noteBlock = day.note
    ? `<div class="land-note"><div class="lbl">오늘의 첫 행동</div><div class="val">${esc(day.note)}</div></div>`
    : `<div class="land-note empty"><div class="val">오늘의 첫 행동은 아직 비어 있어.<br>점수판에서 내일 할 한 가지를 미리 정해두면, 다음 날 여기 떠 있어.</div></div>`;
  document.getElementById('app').innerHTML=`
    <div class="landing${swipe?' swipe-in':''}">
      <div class="land-eyebrow">${dateStr}</div>
      <h1 class="land-h1">${greet}.</h1>
      <p class="land-sub">결과는 네 손에 없어.<br>손에 있는 과정만 세자. 했으면 이긴 거.</p>
      ${noteBlock}
      <button class="land-btn" id="enterBtn">오늘 점수판 열기</button>
    </div>`;
  document.getElementById('enterBtn').onclick=()=>enterApp();
}

/* 랜딩 → 본화면: 랜딩이 부드럽게 빠지고 본화면이 슬라이드-페이드로 들어옴 */
function enterApp(){
  const land=document.querySelector('.landing');
  const go=async()=>{
    await render();
    const app=document.getElementById('app');
    app.classList.add('page-in');
    setTimeout(()=>app.classList.remove('page-in'),440);
    window.scrollTo(0,0);
  };
  if(land && !_reduceMotion){
    land.classList.add('leaving');
    setTimeout(go,300);
  } else { go(); }
}

  const st=streak(), totalDays=index.length;

  const carry = day.note
    ? `<div class="carry"><div class="lbl">어제의 너 → 오늘의 너</div><div class="val">${esc(day.note)}</div></div>`
    : `<div class="carry empty"></div>`;

  const winRows=config.wins.map(w=>{
    const t=day.times[w.id]?`✓ ${fmtTime(new Date(day.times[w.id]))} 완료`:'';
    return `<div class="winwrap" data-id="${w.id}">
      <button class="swipe-del" data-del="${w.id}" aria-label="삭제">−</button>

  let cells=[];
  for(let i=6;i>=0;i--){
    const dd=new Date(today); dd.setDate(dd.getDate()-i);
    const rec=await sget('day:'+keyOf(dd));
    const dn=rec?config.wins.filter(w=>rec.checks&&rec.checks[w.id]).length:0;
    const ratio=Math.min(dn/(config.wins.length||1),1), full=ratio>=1;
    const rc=restColor(rec?rec.rest:0);  // 테두리 = 그날 멈추고 싶던 횟수
    cells.push(`<div class="day ${i===0?'today':''}">
      <div class="dot ${full?'full':''}" style="border-color:${rc}"><span class="fill" style="height:${ratio*100}%"></span><span class="n">${dn||''}</span></div>
      <div class="wd">${WD[dd.getDay()]}</div></div>`);

  document.getElementById('app').innerHTML=`
    <div class="topbar"><div class="eyebrow">${dateStr}</div><div class="clock" id="clock">${fmtTime(new Date())}</div></div>
    <h1>오늘의 점수판</h1>
    <div class="sub">결과는 네 손에 없어. 손에 있는 과정만 세자. 했으면 이긴 거.</div>
    ${carry}

    <div class="score">
      <span class="num ${allDone?'win':''}" id="num">${done}</span><span class="denom"> / ${total}</span>
      <div class="cap">${allDone?'<b>오늘 완승.</b> 결과랑 무관하게 너는 이겼어.':`오늘 <b>${done}</b>번 이겼어`}</div>
      <div class="stats">
        <div class="stat"><div class="v"><b>${st}</b></div><div class="k">연속 일</div></div>
        <div class="stat"><div class="v">${totalDays}</div><div class="k">총 기록 일</div></div>
      </div>
    </div>

    <div class="sectlbl sectlbl-add"><span>과정 승리</span><span class="ln"></span><button class="addchip" id="addBtn" aria-label="항목 추가">+</button></div>
    ${winRows}
    <div class="hint">꾹 누르면 수정 · 왼쪽으로 밀면 삭제</div>

    <div class="sectlbl">반응성 휴식</div>
    <div class="rest">
      <p>집중하다 "지금 안 되겠다" 싶을 때 누르기.<br>고치는 버튼이 아니라 <b>알아채는</b> 버튼이야.</p>
      <button class="restbtn" id="restBtn">지금 멈추고 싶다</button>
      <div class="restmsg" id="restMsg"><div class="m"></div><div class="c"></div></div>
    </div>

    <div class="sectlbl">지난 7일</div>
    <div class="strip">${cells.join('')}</div>
    <div class="restcap">원 채움 = 과정 승리 · 테두리 색 = 그날 '멈추고 싶다' 횟수</div>
    <div class="restlegend">${REST_BANDS.map(b=>`<span style="color:${b.color}"><i></i>${b.label}</span>`).join('')}</div>

    <div class="sectlbl">내일의 첫 행동</div>
    <div class="tmr">
      <label>지금 정해두면 내일의 너는 고민 없이 실행만 해. 한 줄로 못 박아.</label>
      <div class="inrow">
        <input id="tmrIn" placeholder="예: X 열고 1~10번 풀기" maxlength="60">

  bind();

/* 체크 토글 */
async function toggleWin(id){
  const now=!day.checks[id];
  day.checks[id]=now;
  if(now) day.times[id]=new Date().toISOString(); else delete day.times[id];
  await saveDay();
  applyCheck(id, now);   // 전체 재렌더 대신 부분 갱신 → 체크박스 스프링 애니메이션 유지
}

/* 체크 상태만 부분 갱신: 해당 카드의 done 클래스 토글(애니메이션 발생) + 점수/통계/오늘 점 갱신 */
function applyCheck(id, now){
  const win=document.querySelector(`.winwrap[data-id="${id}"] .win`);
  if(win){
    win.classList.toggle('done', now);
    const ts=win.querySelector('.ts');
    if(ts) ts.textContent = (now && day.times[id]) ? `✓ ${fmtTime(new Date(day.times[id]))} 완료` : '';
  }
  refreshScoreUI();
  if(now){ const n=document.getElementById('num'); if(n){ n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop'); setTimeout(()=>n.classList.remove('pop'),260); } }
}

/* 점수/캡션/연속·총합/오늘 막대 점을 다시 그리지 않고 값만 갱신 */
function refreshScoreUI(){
  const total=config.wins.length, done=doneCount(), allDone=total>0&&done===total;
  const numEl=document.getElementById('num');
  if(numEl){ numEl.textContent=done; numEl.classList.toggle('win',allDone); }
  const denom=document.querySelector('.score .denom'); if(denom) denom.textContent=` / ${total}`;
  const cap=document.querySelector('.score .cap');
  if(cap) cap.innerHTML = allDone ? '<b>오늘 완승.</b> 결과랑 무관하게 너는 이겼어.' : `오늘 <b>${done}</b>번 이겼어`;
  const vals=document.querySelectorAll('.score .stat .v');
  if(vals[0]) vals[0].innerHTML=`<b>${streak()}</b>`;
  if(vals[1]) vals[1].textContent=index.length;
  const ratio=Math.min(done/(total||1),1);
  const fill=document.querySelector('.day.today .dot .fill'); if(fill) fill.style.height=(ratio*100)+'%';
  const dot=document.querySelector('.day.today .dot'); if(dot) dot.classList.toggle('full',ratio>=1);
  const n=document.querySelector('.day.today .dot .n'); if(n) n.textContent=done||'';
}

/* 꾹 눌러 텍스트 편집 (isNew=true면 비워두고 취소 시 삭제) */
function beginEdit(win, id, isNew){
  if(!win) return;
  const txt=win.querySelector('.txt');
  if(!txt || txt.getAttribute('contenteditable')==='true') return;
  if(navigator.vibrate) try{navigator.vibrate(12);}catch(e){}
  win.classList.add('row-editing');
  txt.classList.add('editing-txt');
  txt.setAttribute('contenteditable','true');
  txt.focus();
  const sel=getSelection(), rng=document.createRange();
  rng.selectNodeContents(txt); sel.removeAllRanges(); sel.addRange(rng);
  let done=false;
  const finish=async()=>{
    if(done) return; done=true;
    txt.removeEventListener('blur',finish); txt.removeEventListener('keydown',onkey);
    txt.removeAttribute('contenteditable'); txt.classList.remove('editing-txt'); win.classList.remove('row-editing');
    const val=txt.textContent.trim();
    const w=config.wins.find(x=>x.id===id);
    if(val){ if(w&&w.label!==val){ w.label=val; await saveConfig(); } }
    else { config.wins=config.wins.filter(x=>x.id!==id); delete day.checks[id]; delete day.times[id]; await saveConfig(); await saveDay(); }
    await render();
  };
  const onkey=(e)=>{
    if(e.key==='Enter'){ e.preventDefault(); txt.blur(); }
    else if(e.key==='Escape'){ if(isNew) txt.textContent=''; else { const w=config.wins.find(x=>x.id===id); txt.textContent=w?w.label:''; } txt.blur(); }
  };
  txt.addEventListener('blur',finish);
  txt.addEventListener('keydown',onkey);
}

/* 삭제: 슬라이드 아웃 + 높이 접힘 애니메이션 후 데이터에서 제거 */
function deleteWin(id){
  const wrap=document.querySelector(`.winwrap[data-id="${id}"]`);
  if(!wrap || _reduceMotion){ doDelete(id); return; }
  const win=wrap.querySelector('.win');
  win.style.transition='transform .22s ease'; win.style.transform='translateX(-100%)';
  wrap.style.height=wrap.offsetHeight+'px';
  wrap.classList.add('removing');
  requestAnimationFrame(()=>{ wrap.style.height='0px'; wrap.style.marginBottom='0px'; wrap.style.opacity='0'; });
  setTimeout(()=>doDelete(id), 290);
}
async function doDelete(id){
  config.wins=config.wins.filter(w=>w.id!==id); delete day.checks[id]; delete day.times[id];
  await saveConfig(); await saveDay(); await render();
}

/* 한 항목의 탭/꾹누름/스와이프 제스처 처리
   - 방향 잠금(14px) 전에는 아무 일도 안 함 → 깜빡임 없음
   - 가로 잠기면 preventDefault로 브라우저 스크롤/취소 차단 → '멀리 밀면 되돌아감' 해결
   - 빨간 영역은 항상 뒤에 깔려 있어 .win 카드만 이동(transform) */
function setupWinRow(wrap){
  const win=wrap.querySelector('.win');
  const id=wrap.dataset.id;
  const BTN=76;                  // 살짝 열었을 때 드러나는 폭
  const DECIDE=14;               // 방향 결정 임계(px) — 이하에선 무반응
  let sx=0,sy=0,dx=0,drag=false,decided=false,horiz=false,open=false,moved=false,lp=null,longP=false;
  const setX=x=>{ win.style.transform=`translateX(${x}px)`; };
  const clearLP=()=>{ if(lp){clearTimeout(lp);lp=null;} };
  const rowW=()=>wrap.offsetWidth||320;

  function start(x,y){
    if(win.classList.contains('row-editing')) return;
    sx=x;sy=y;dx=0;drag=true;decided=false;horiz=false;moved=false;longP=false;
    win.style.transition='none';
    clearLP();
    lp=setTimeout(()=>{ if(!moved && !open){ longP=true; beginEdit(win,id); } }, 480);
  }
  // 반환값 true = 가로 제스처를 소비함(브라우저 동작 막아야 함)
  function move(x,y){
    if(!drag) return false;
    const ddx=x-sx, ddy=y-sy;
    if(Math.abs(ddx)>4||Math.abs(ddy)>4){ moved=true; clearLP(); }
    if(!decided){
      if(Math.abs(ddx)>=DECIDE || Math.abs(ddy)>=DECIDE){
        decided=true;
        horiz = Math.abs(ddx) > Math.abs(ddy)*1.3;   // 가로가 확실히 우세할 때만
      } else return false;                            // 아직 방향 미정 → 스크롤 허용
    }
    if(!horiz) return false;                           // 세로 스크롤은 그대로 둠
    _winHoriz=true;                                    // 랜딩(우측) 제스처 억제
    wrap.classList.add('swiping');                     // 이때부터 빨강 노출(평소엔 숨김)
    dx=ddx;
    let nx=(open?-BTN:0)+ddx;
    nx=Math.max(Math.min(nx,0),-rowW());               // 0 ~ -행너비
    setX(nx);
    return true;
  }
  function settle(){
    if(!drag) return; drag=false; clearLP();
    win.style.transition='transform .26s cubic-bezier(.2,.8,.3,1)';
    if(horiz){
      const finalX=(open?-BTN:0)+dx;
      if(finalX <= -rowW()*0.5){ deleteWin(id); return; }   // 행 절반 이상 → 삭제(빨강 유지)
      else if(finalX <= -BTN*0.5){ open=true;  setX(-BTN); wrap.classList.remove('swiping'); wrap.classList.add('open'); }  // 열기
      else { open=false; setX(0); wrap.classList.remove('swiping','open'); }                  // 닫기(빨강 사라짐)
    } else if(!longP && !decided){
      // 방향이 결정될 만큼(14px) 움직이지 않은 작은 동작 = 탭 (손가락 미세 흔들림 허용)
      if(open){ open=false; setX(0); wrap.classList.remove('swiping','open'); }  // 열린 상태 탭 → 닫기
      else toggleWin(id);                                                        // 일반 탭 → 체크
    } else { wrap.classList.remove('swiping'); }
  }
  // 터치(모바일)
  win.addEventListener('touchstart', e=>{ const t=e.touches[0]; start(t.clientX,t.clientY); }, {passive:true});
  win.addEventListener('touchmove',  e=>{ const t=e.touches[0]; if(move(t.clientX,t.clientY) && e.cancelable) e.preventDefault(); }, {passive:false});
  win.addEventListener('touchend',   e=>{ const t=e.changedTouches[0]; if(t) dx=t.clientX-sx; settle(); }, {passive:true});
  win.addEventListener('touchcancel',e=>{ const t=e.changedTouches[0]; if(t) dx=t.clientX-sx; settle(); }, {passive:true});
  // 마우스(데스크톱) — 드래그 중에만 window 리스너 부착/해제(누수 방지)
  const mm=e=>move(e.clientX,e.clientY);
  const mu=e=>{ dx=e.clientX-sx; window.removeEventListener('mousemove',mm); window.removeEventListener('mouseup',mu); settle(); };
  win.addEventListener('mousedown', e=>{ if(e.button!==0||win.classList.contains('row-editing')) return;
    start(e.clientX,e.clientY); window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu); });
}

/* ---------- 순서 이동(드래그 앤 드롭, 아이폰식) ---------- */
let _reord=null;
function reorderStart(clientY, wrap){
  const wraps=[...document.querySelectorAll('.winwrap')];
  const idx=wraps.indexOf(wrap);
  if(idx<0) return;
  const rowH=wrap.offsetHeight + 10; // margin-bottom 포함
  _reord={wrap, idx, target:idx, startY:clientY, rowH, wraps};
  wrap.classList.add('dragging');
  const dwin=wrap.querySelector('.win');
  dwin.style.transition='transform .16s ease, box-shadow .18s ease';
  dwin.style.transform='scale(1.03)';
  wrap.style.transition='none'; // 끌리는 행은 손가락을 즉시 따라감
  if(navigator.vibrate) try{navigator.vibrate(10);}catch(_){}
}
function reorderMove(clientY){
  if(!_reord) return;
  const {wrap, idx, startY, rowH, wraps}=_reord;
  const dy=clientY-startY;
  wrap.style.transform=`translateY(${dy}px)`;
  let target=idx + Math.round(dy/rowH);
  target=Math.max(0, Math.min(wraps.length-1, target));
  _reord.target=target;
  wraps.forEach((w,j)=>{
    if(w===wrap) return;
    let shift=0;
    if(idx<target && j>idx && j<=target) shift=-rowH;        // 아래로 이동 → 사이 행 위로
    else if(idx>target && j>=target && j<idx) shift=rowH;    // 위로 이동 → 사이 행 아래로
    w.style.transform = shift ? `translateY(${shift}px)` : '';
  });
}
function reorderEnd(){
  if(!_reord) return;
  const {wrap, idx, target, rowH}=_reord; _reord=null;
  const dwin=wrap.querySelector('.win');
  wrap.style.transition='transform .2s cubic-bezier(.2,.8,.3,1)';
  wrap.style.transform=`translateY(${(target-idx)*rowH}px)`; // 빈 슬롯으로 안착
  wrap.classList.remove('dragging');
  dwin.style.transform=''; // 들어올림 해제(부드럽게 내려앉음)
  setTimeout(async()=>{
    if(target!==idx){
      const arr=config.wins, [m]=arr.splice(idx,1); arr.splice(target,0,m);
      await saveConfig();
    }
    await render(); // 인라인 transform 전부 초기화 + 새 순서 반영
  }, 200);
}
function setupReorder(){
  document.querySelectorAll('.grip').forEach(grip=>{
    const wrap=grip.closest('.winwrap');
    // 터치
    grip.addEventListener('touchstart', e=>{ e.stopPropagation(); const t=e.touches[0]; reorderStart(t.clientY, wrap); }, {passive:true});
    grip.addEventListener('touchmove',  e=>{ e.stopPropagation(); if(e.cancelable) e.preventDefault(); reorderMove(e.touches[0].clientY); }, {passive:false});
    grip.addEventListener('touchend',   e=>{ e.stopPropagation(); reorderEnd(); }, {passive:true});
    grip.addEventListener('touchcancel',e=>{ e.stopPropagation(); reorderEnd(); }, {passive:true});
    // 마우스(데스크톱)
    const gm=e=>reorderMove(e.clientY);
    const gu=e=>{ window.removeEventListener('mousemove',gm); window.removeEventListener('mouseup',gu); reorderEnd(); };
    grip.addEventListener('mousedown', e=>{ e.stopPropagation(); e.preventDefault();
      reorderStart(e.clientY, wrap); window.addEventListener('mousemove',gm); window.addEventListener('mouseup',gu); });
  });
}

function bind(){
  // 각 항목: 탭=체크, 꾹누름=편집, 좌측으로 밀기=삭제, 손잡이 드래그=순서이동
  document.querySelectorAll('.winwrap').forEach(setupWinRow);
  setupReorder();
  // 빨간 삭제 버튼 탭
  document.querySelectorAll('.swipe-del').forEach(btn=>{
    btn.onclick=e=>{ e.stopPropagation(); deleteWin(btn.dataset.del); };
  });
  // + 항목 추가 → 새 빈 항목 만들고 바로 편집 모드
  document.getElementById('addBtn').onclick=async()=>{
    const id='w'+Date.now();
    config.wins.push({id,label:''});
    await saveConfig(); await render();
    const wrap=document.querySelector(`.winwrap[data-id="${id}"]`);
    if(wrap){ beginEdit(wrap.querySelector('.win'), id, true); wrap.scrollIntoView({behavior:'smooth',block:'center'}); }
  };
  document.getElementById('restBtn').onclick=async()=>{
    day.rest=(day.rest||0)+1; await saveDay();
    const line=REST_LINES[(day.rest-1)%REST_LINES.length], m=document.getElementById('restMsg');
    m.querySelector('.m').textContent=line[0]+' '+line[1];
    m.querySelector('.c').textContent=`오늘 ${day.rest}번 알아챘어 · ${fmtTime(new Date())}`;
    m.classList.add('show');
    // 오늘 원의 테두리 색을 즉시 갱신 (채움색은 그대로)
    const td=document.querySelector('.day.today .dot');
    if(td) td.style.borderColor=restColor(day.rest);
  };
  document.getElementById('tmrSave').onclick=async()=>{
    const v=document.getElementById('tmrIn').value.trim(); if(!v) return;
    const tmr=new Date(today);tmr.setDate(tmr.getDate()+1);const k='day:'+keyOf(tmr);
    const rec=await sget(k)||{checks:{},times:{},rest:0,note:''}; rec.note=v; await sset(k,rec);
    document.getElementById('tmrSaved').classList.add('show'); document.getElementById('tmrIn').value='';
    setTimeout(()=>document.getElementById('tmrSaved').classList.remove('show'),3000);
  };
  document.getElementById('exportBtn').onclick=()=>exportData();
  document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
  document.getElementById('importFile').onchange=async e=>{
    const f=e.target.files[0]; if(f) await importData(f); e.target.value='';
  };
}

/* ---------- 탭 모션: 어떤 버튼/항목을 눌러도 리플 + 눌림 효과 ---------- */
const _reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function spawnRipple(el, x, y){
  if(_reduceMotion) return;
  const rect=el.getBoundingClientRect();
  const size=Math.max(rect.width,rect.height);
  const r=document.createElement('span');
  r.className='ripple';
  r.style.width=r.style.height=size+'px';
  r.style.left=((x??rect.left+rect.width/2)-rect.left-size/2)+'px';
  r.style.top =((y??rect.top +rect.height/2)-rect.top -size/2)+'px';
  el.appendChild(r);
  setTimeout(()=>r.remove(),560);
}
document.addEventListener('pointerdown', e=>{
  const el=e.target.closest('button');   // 항목(.win)은 자체 스와이프/체크 모션이 있어 제외
  if(el) spawnRipple(el, e.clientX, e.clientY);
}, {passive:true});

/* ---------- 제스처: 왼→오른쪽 슬라이드 시 랜딩 페이지 ---------- */
let _sx=0,_sy=0,_st=0,_swiping=false,_winHoriz=false;
function _gestStart(x,y){ _sx=x; _sy=y; _st=Date.now(); _swiping=true; _winHoriz=false; }
function _gestEnd(x,y){
  if(!_swiping) return; _swiping=false;
  if(_winHoriz){ _winHoriz=false; return; }  // 항목을 좌측으로 미는 중이면 랜딩 제스처 무시
  const dx=x-_sx, dy=y-_sy, dt=Date.now()-_st;
  // 오른쪽으로 충분히(70px+), 빠르게(600ms내), 가로 위주로 이동했을 때
  if(dt<600 && dx>70 && Math.abs(dx) > Math.abs(dy)*1.8){
    if(!document.querySelector('.landing')){ renderLanding(true); window.scrollTo(0,0); }
  }
}
document.addEventListener('touchstart', e=>{ const t=e.changedTouches[0]; _gestStart(t.clientX,t.clientY); }, {passive:true});
document.addEventListener('touchend',   e=>{ const t=e.changedTouches[0]; _gestEnd(t.clientX,t.clientY); }, {passive:true});
// 마우스(데스크톱)에서도 드래그로 동작
document.addEventListener('mousedown', e=>_gestStart(e.clientX,e.clientY));
document.addEventListener('mouseup',   e=>_gestEnd(e.clientX,e.clientY));

/* ---------- 시간 연동: 30초마다 시계 갱신 + 자정 넘어가면 새 날로 ---------- */
function tick(){
  const c=document.getElementById('clock'); if(c) c.textContent=fmtTime(new Date());
  if(keyOf(new Date())!==TODAY){
    (async()=>{ setToday(); await loadDay(); await render(); })();
  }
}
setInterval(tick,30000);

const _reloadBtn=`<br><br><button onclick="location.reload()" style="margin-top:16px;padding:10px 24px;background:#e8b257;color:#241c08;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer">새로고침</button>`;
const _loadGuard=setTimeout(()=>{
  const a=document.getElementById('app');
  if(a&&a.querySelector('.loading'))
    a.innerHTML=`<div class="loading">로딩이 너무 오래 걸려.<br>브라우저 캐시를 지우고 새로고침해봐.${_reloadBtn}</div>`;
},8000);
(async()=>{
  try{
    await load();
    clearTimeout(_loadGuard);
    renderLanding();
  }catch(err){
    clearTimeout(_loadGuard);
    document.getElementById('app').innerHTML=`<div class="loading" style="color:#e07070">오류: ${err&&err.message?err.message:'알 수 없는 오류'}${_reloadBtn}</div>`;
    console.error('[점수판] init error:', err);
  }
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
